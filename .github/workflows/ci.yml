name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    name: C++ ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: "OFF"
          - name: Debug + ASan/UBSan
            build_type: Debug
            sanitize: "ON"
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DITCH_SANITIZE=${{ matrix.sanitize }}
          -DITCH_NATIVE=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python plots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Smoke test (benchmark chart from docs/benchmarks.md)
        run: python tools/plot.py bench docs/benchmarks.md --out ci-img && test -s ci-img/bench_history.png
